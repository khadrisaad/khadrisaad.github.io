<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guidr</title>
<style>html,body{margin:0;height:100%;background:#1E6FD0}body{overflow:hidden}#loading{display:grid;place-items:center;height:100%;font:16px system-ui;color:white}</style>
</head>
<body>
<div id="loading">Loading Guidr…</div>
<script>
fetch('https://raw.githubusercontent.com/khadrisaad/khadrisaad.github.io/3e15a3e3b05ebaff10a1beda4b2bfb45a171af0e/index.html', {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error('load failed'); return r.text(); })
  .then(html => { document.open(); document.write(html); document.close(); })
  .catch(() => { document.getElementById('loading').textContent = 'Guidr is loading, refresh once.'; });
</script>
</body>
</html>
