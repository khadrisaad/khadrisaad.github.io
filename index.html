        .glass-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        h1 {
            font-size: clamp(24px, 6vw, 48px);
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        input {
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 14px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease-out;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.25);
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease-out;
            box-shadow: 0 4px 15px rgba(31, 38, 135, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(31, 38, 135, 0.6);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .counter {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .counter-number {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .counter-label {
            font-size: 13px;
            opacity: 0.8;
        }

        .shimmer {
            animation: shimmer 1.5s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .message {
            margin-top: 12px;
            font-size: 13px;
            min-height: 18px;
        }

        .success {
            color: #a1f5a1;
        }

        .error {
            color: #ff6b6b;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
                white-space: normal;
            }

            .glass-container {
                padding: 40px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="glass-container">
            <h1>Travel, finally in one place</h1>
            <p class="subtitle">Discover, plan, and share your adventures with Guidr. Coming to iOS and Android.</p>

            <form class="signup-form" id="signupForm">
                <input type="email" id="email" placeholder="Enter your email" required>
                <button type="submit" id="submitBtn">Join the Waitlist</button>
            </form>

            <div class="message" id="message"></div>

            <div class="counter">
                <div class="counter-number" id="counterNum">Loading...</div>
                <div class="counter-label">Travelers on the waitlist</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gjqhfdsofzjzgchvuwqg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdqcWhmZHNvZnpqemdjaHZ1d3FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjQ4Nzk4MTAsImV4cCI6MjA0MDQ1NTgxMH0.3Hx4vCJM_bB8cF3y_D5jVzXC_K3KHXXXXXXXXXXX';

        async function getWaitlistCount() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/waitlist_count`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    }
                });
                const data = await response.json();
                const count = data || localStorage.getItem('waitlist_count') || '0';
                document.getElementById('counterNum').textContent = count;
                document.getElementById('counterNum').classList.remove('shimmer');
            } catch (err) {
                const cached = localStorage.getItem('waitlist_count') || '0';
                document.getElementById('counterNum').textContent = cached;
                document.getElementById('counterNum').classList.remove('shimmer');
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');
            const msgDiv = document.getElementById('message');

            btn.disabled = true;
            msgDiv.className = '';
            msgDiv.textContent = '';

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/join_waitlist`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                    },
                    body: JSON.stringify({ email })
                });

                if (!response.ok) {
                    throw new Error('Failed to join waitlist');
                }

                const data = await response.json();
                const position = data || 'added';

                msgDiv.className = 'message success';
                msgDiv.textContent = `Welcome! You're #${position} on the waitlist`;
                document.getElementById('email').value = '';

                setTimeout(getWaitlistCount, 500);
            } catch (err) {
                msgDiv.className = 'message error';
                msgDiv.textContent = 'Error joining waitlist. Try again.';
            } finally {
                btn.disabled = false;
            }
        });

        getWaitlistCount();
    </script>
</body>
</html>
