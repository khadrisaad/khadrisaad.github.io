<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Guidr · Join the waitlist</title>
<style>html,body{margin:0;height:100%;background:#0E58B8}#loading{display:grid;place-items:center;height:100%;font:16px system-ui;color:white}</style>
</head>
<body>
<div id="loading">Loading Guidr…</div>
<script>
(async function(){
  try {
    const url='https://raw.githubusercontent.com/khadrisaad/khadrisaad.github.io/3e15a3e3b05ebaff10a1beda4b2bfb45a171af0e/index.html?v=restore-20260925';
    const r=await fetch(url,{cache:'no-store',mode:'cors'});
    if(!r.ok) throw new Error('load failed');
    const html=await r.text();
    document.open(); document.write(html); document.close();
  } catch(e) {
    document.getElementById('loading').textContent='Refresh once to load Guidr.';
  }
})();
</script>
</body>
</html>
